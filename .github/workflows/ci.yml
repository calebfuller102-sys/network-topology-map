name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Lint backend
        run: python -m ruff check backend/app backend/tests
      - name: Test backend
        run: python -m pytest backend/tests
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify generated local assets
        working-directory: frontend
        run: pnpm verify:assets
      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Test interaction state
        working-directory: frontend
        run: pnpm test:interactions
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
