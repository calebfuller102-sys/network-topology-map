name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Lint backend
        run: python -m ruff check backend/app backend/tests
      - name: Test backend
        run: python -m pytest backend/tests
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify generated local assets
        working-directory: frontend
        run: pnpm verify:assets
      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Test interaction state
        working-directory: frontend
        run: pnpm test:interactions
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Install Chromium for browser regression checks
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Check narrow populated-map inspector behavior
        working-directory: frontend
        run: pnpm test:browser

  container-images:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default Compose model
        run: docker compose config --quiet
      - name: Validate optional deployment overlays
        env:
          NPM_DOCKER_NETWORK: ci-npm-network
        run: |
          docker compose -f compose.yaml -f compose.npm-network.yaml config --quiet
          docker compose -f compose.yaml -f compose.icmp-capability.yaml config --quiet
      - name: Check operator shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/tests/test-restore-compose-context.sh
      - name: Build pinned runtime images
        run: docker compose build --pull
      - name: Smoke test gateway after API recreation
        run: |
          docker compose up --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/healthz; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/api/v1/healthz
      - name: Export, import, and smoke-test offline amd64 images
        run: |
          archive="$RUNNER_TEMP/network-topology-amd64.tar"
          bash scripts/export-images.sh linux/amd64 "$archive"
          test -f "$archive"
          test -f "${archive}.sha256"
          test -f "${archive}.platform"
          docker compose down --volumes
          docker image rm network-topology-api:0.1.0 network-topology-web:0.1.0
          bash scripts/import-images.sh "$archive"
          docker image inspect network-topology-api:0.1.0 network-topology-web:0.1.0
          docker compose up --detach --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/healthz; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/api/v1/healthz
          map_id=$(curl --fail --silent http://127.0.0.1:8080/api/v1/maps | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          set +e
          stream=$(curl --no-buffer --silent --max-time 18 "http://127.0.0.1:8080/api/v1/maps/${map_id}/events?after=0")
          stream_status=$?
          set -e
          test "$stream_status" -eq 28
          grep -q '^: connected' <<< "$stream"
          grep -q '^: keepalive' <<< "$stream"
          docker compose up --detach --force-recreate api
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/healthz; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/api/v1/healthz
      - name: Capture container logs on failure
        if: failure()
        run: |
          docker compose config --format json | jq '.services.web.ports'
          docker compose ps --all
          web_id="$(docker compose ps --all --quiet web)"
          if [ -n "$web_id" ]; then
            docker inspect "$web_id" --format 'host port bindings: {{json .HostConfig.PortBindings}}; network ports: {{json .NetworkSettings.Ports}}; exposed ports: {{json .Config.ExposedPorts}}'
          fi
          docker compose port web 8080 || true
          docker compose logs --no-color --timestamps
      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes
