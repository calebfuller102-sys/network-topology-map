name: network-topology

services:
  web:
    image: ghcr.io/calebfuller102-sys/network-topology-map-web:0.1.1
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    expose:
      - "8080"
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      app: {}
      gateway: {}

  api:
    image: ghcr.io/calebfuller102-sys/network-topology-map-api:0.1.1
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      DATABASE_URL: sqlite:////data/topology.db
      DATABASE_PATH: /data/topology.db
      MONITOR_CONCURRENCY: ${MONITOR_CONCURRENCY:-8}
    volumes:
      - topology-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app: {}
      monitor-egress: {}
    # Add NET_RAW only after the selected ICMP implementation is tested in the
    # target LXC. Never use privileged: true as an ICMP workaround.

volumes:
  topology-data:

networks:
  app:
    internal: true
  # Publish the gateway through the host without granting the web process
  # outbound source-NAT access. Keep API reachability on the internal app net.
  gateway:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Only the API joins this non-internal bridge so checks can reach routed
  # targets. The API remains unpublished; host firewall/routing still applies.
  monitor-egress: {}
